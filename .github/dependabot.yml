version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
    groups:
      # No update-types filter here, unlike the other groups: every action is
      # pinned by commit SHA with the tag in a trailing comment, so a bump at
      # any level arrives as a new SHA and there is no lockfile or CI check
      # that would catch a stale pin. One grouped pull request a week is the
      # only record a human gets, so none of the levels is filtered out.
      actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/teleop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/companion-realtime"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned deliberately in this project's pyproject.toml -- newer
      # releases changed the Tasks API this app depends on.
      - dependency-name: "mediapipe"
