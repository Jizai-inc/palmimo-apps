name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  apps:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [teleop, companion-realtime]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # sounddevice loads PortAudio at import time.
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --dev --python 3.12
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen python -m mypy
      - run: uv run --frozen pytest --cov
